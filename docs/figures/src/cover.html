<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0d1b2a;--ink:#f0efec;--ink2:#b9c3cf;--accent:#3987e5;--accent2:#1baf7a;--line:#24384f}
*{box-sizing:border-box;margin:0}
body{width:560px;height:280px;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:16px 16px;opacity:.9}
.wrap{position:absolute;inset:0;padding:30px 32px;display:flex;flex-direction:column}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
h1{font-family:"Inter Display",Inter,sans-serif;font-size:40px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
h1 span{color:var(--accent)}
.sub{font-size:13.5px;color:var(--ink2);margin-top:6px;max-width:460px;line-height:1.4}
.stats{margin-top:auto;display:flex;gap:26px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;color:var(--ink2);letter-spacing:.02em}
.shield{position:absolute;right:34px;top:34px;width:92px;height:108px}
</style></head><body><div class="grid"></div>
